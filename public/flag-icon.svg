<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5F8"/>
      <stop offset="100%" stop-color="#5A8FBD"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- White center band -->
  <rect y="21" width="64" height="22" fill="#FFFFFF"/>
  <!-- Sol de Mayo -->
  <circle cx="32" cy="32" r="6" fill="#F6B40E"/>
  <circle cx="32" cy="32" r="4.2" fill="#FCCE42"/>
  <!-- Straight rays -->
  <g stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round">
    <line x1="32" y1="22" x2="32" y2="25"/>
    <line x1="32" y1="39" x2="32" y2="42"/>
    <line x1="22" y1="32" x2="25" y2="32"/>
    <line x1="39" y1="32" x2="42" y2="32"/>
  </g>
  <!-- Diagonal rays -->
  <g stroke="#F6B40E" stroke-width="1.4" stroke-linecap="round">
    <line x1="24.9" y1="24.9" x2="27.1" y2="27.1"/>
    <line x1="36.9" y1="36.9" x2="39.1" y2="39.1"/>
    <line x1="39.1" y1="24.9" x2="36.9" y2="27.1"/>
    <line x1="27.1" y1="36.9" x2="24.9" y2="39.1"/>
  </g>
  <!-- Wavy rays (shorter, between straight and diagonal) -->
  <g stroke="#F6B40E" stroke-width="1" stroke-linecap="round">
    <line x1="26" y1="23.5" x2="28" y2="26"/>
    <line x1="38" y1="23.5" x2="36" y2="26"/>
    <line x1="23.5" y1="26" x2="26" y2="28"/>
    <line x1="40.5" y1="26" x2="38" y2="28"/>
    <line x1="23.5" y1="38" x2="26" y2="36"/>
    <line x1="40.5" y1="38" x2="38" y2="36"/>
    <line x1="26" y1="40.5" x2="28" y2="38"/>
    <line x1="38" y1="40.5" x2="36" y2="38"/>
  </g>
  <!-- Face dots (subtle) -->
  <circle cx="30.2" cy="31" r="0.7" fill="#C8920A"/>
  <circle cx="33.8" cy="31" r="0.7" fill="#C8920A"/>
  <ellipse cx="32" cy="33.5" rx="1.5" ry="0.6" fill="none" stroke="#C8920A" stroke-width="0.6"/>
</svg>
